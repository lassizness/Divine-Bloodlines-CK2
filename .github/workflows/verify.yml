name: Verify release packages

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4

      - name: Compile release scripts
        run: python3 -m compileall -q scripts/

      - name: Test three-part version increments
        run: python3 -m unittest discover -s tests -v

      - name: Validate the current version and ZIP layouts
        run: python3 scripts/package_release.py

      - name: Simulate the next release without publishing
        shell: bash
        run: |
          set -euo pipefail
          previous="$(cat VERSION)"
          python3 scripts/bump_version.py
          next="$(cat VERSION)"
          if [[ "$previous" == "$next" ]]; then
            echo "The version was not incremented" >&2
            exit 1
          fi
          python3 scripts/package_release.py
